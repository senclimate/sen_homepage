[build]
  command = "npm install --no-audit --no-fund && PATH=$PWD/node_modules/.bin:$PATH hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.168.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "npm install --no-audit --no-fund && PATH=$PWD/node_modules/.bin:$PATH hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "npm install --no-audit --no-fund && PATH=$PWD/node_modules/.bin:$PATH hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"

[[headers]]
  for = "index.xml"
  [headers.values]
    Content-Type = "application/rss+xml"

